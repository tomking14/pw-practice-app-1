# this is like an orchestrator to run multiple container, define dependencies, and such
services:
  playwright-test:
    image: playwright-test
    build:
      context: .
      dockerfile: ./Dockerfile
      command: npm run pageObjects-chrome
      # files from the app playwright report will be copied into the local playwright report
      volumes:
        - ./playwright-report/:/app/playwright-report
        - ./test-results/:/app/test-results